name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-budget:
    name: Bundle Budget Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      # Set to "warn" to report budget overages without failing the job.
      # Defaults to "fail" so unreviewed bundle growth is blocked.
      BUNDLE_BUDGET_MODE: ${{ vars.BUNDLE_BUDGET_MODE || 'fail' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Check bundle budgets
        run: pnpm --filter frontend bundle:check

      - name: Upload bundle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-reports
          path: frontend/.bundle-reports
          if-no-files-found: warn
          retention-days: 14