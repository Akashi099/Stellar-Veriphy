name: Dependency maintenance

on:
  schedule:
    - cron: "41 7 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package.json"
      - "scripts/security/dependency-maintenance.py"
      - ".github/workflows/dependency-maintenance.yml"

permissions:
  contents: read

jobs:
  review:
    name: Dependency maintenance review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review direct dependencies against registry maintenance metadata
        run: python scripts/security/dependency-maintenance.py
      - name: Publish review summary
        if: always()
        run: cat dependency-maintenance.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-maintenance
          path: dependency-maintenance.md
          if-no-files-found: error
          retention-days: 90
